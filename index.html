<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Pixel Hex Community Planet</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: radial-gradient(circle at center, #1b1b2f 0%, #0d0d18 100%);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      user-select: none;
    }

    #hint {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #eaeaea;
      background: rgba(15, 15, 25, 0.85);
      border: 1px solid #444;
      border-radius: 8px;
      padding: 12px 18px;
      pointer-events: none;
      font-family: monospace;
      font-size: 13px;
    }

    #info-modal {
      position: absolute;
      bottom: 24px;
      right: 24px;
      width: 320px;
      background: rgba(20, 20, 32, 0.95);
      border: 2px solid #5ce1e6;
      border-radius: 12px;
      padding: 20px;
      color: #fff;
      display: none;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(8px);
      z-index: 100;
    }

    #info-modal h3 {
      margin: 0 0 6px 0;
      color: #5ce1e6;
      font-size: 18px;
    }

    #info-modal .cell-badge {
      display: inline-block;
      font-size: 11px;
      background: #333;
      padding: 2px 6px;
      border-radius: 4px;
      margin-bottom: 12px;
      color: #aaa;
      font-family: monospace;
    }

    #info-modal p {
      font-size: 14px;
      line-height: 1.5;
      color: #ccc;
      margin: 0 0 16px 0;
    }

    #info-modal a {
      display: inline-block;
      color: #12121a;
      background: #5ce1e6;
      text-decoration: none;
      font-weight: bold;
      font-size: 13px;
      padding: 8px 14px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    #info-modal a:hover {
      background: #39b2b7;
    }

    #info-modal .close-btn {
      position: absolute;
      top: 12px;
      right: 14px;
      background: transparent;
      border: none;
      color: #888;
      font-size: 18px;
      cursor: pointer;
    }
    #info-modal .close-btn:hover { color: #fff; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

  <div id="hint">
    <b>Коллаборативная Планета (42 ячейки)</b><br>
    • Честный 2.5D параллакс слоев<br>
    • Автодоворот к камере и пиксельный свет<br>
    • Клик: Профиль автора и описание<br>
    • ЛКМ + Drag: Вращение сферы
  </div>

  <div id="info-modal">
    <button class="close-btn" onclick="closeModal()">×</button>
    <div id="modal-cell-type" class="cell-badge">Ячейка #0</div>
    <h3 id="modal-artist">Имя художника</h3>
    <p id="modal-desc">Описание диорамы...</p>
    <a id="modal-link" href="#" target="_blank">Профиль автора →</a>
  </div>

  <script>
    const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSdgl15hbP2GJpqXlmz1lVPFX1nX0_VTNw52q1iUtRGGciDLSvYBEdqC75LWML8zXG4jw_ZlQlXEoq1/pub?gid=0&single=true&output=csv";

    // 1. СЦЕНА, КАМЕРА, ОСВЕЩЕНИЕ
    const scene = new THREE.Scene();
    const aspect = window.innerWidth / window.innerHeight;
    const viewSize = 13;
    const camera = new THREE.OrthographicCamera(
      -viewSize * aspect, viewSize * aspect,
      viewSize, -viewSize,
      0.1, 1000
    );
    camera.position.set(22, 26, 22);

    const renderer = new THREE.WebGLRenderer({ antialias: false, alpha: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    document.body.appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.autoRotate = false;

    // Освещение: мягкий рассеянный свет + направленное теплое солнце
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.75);
    scene.add(ambientLight);
    const sunLight = new THREE.DirectionalLight(0xfff7e6, 0.65);
    sunLight.position.set(30, 45, 25);
    scene.add(sunLight);

    const planetRadius = 8.0;
    const planetGroup = new THREE.Group();
    scene.add(planetGroup);

    // 2. ДЕФОЛТНЫЙ ШАБЛОН
    function createFallbackTexture(cellId, isPentagon) {
      const c = document.createElement('canvas');
      c.width = 64;
      c.height = 64;
      const ctx = c.getContext('2d');
      ctx.imageSmoothingEnabled = false;

      ctx.fillStyle = isPentagon ? '#2263b3' : '#3f8a28';
      ctx.fillRect(0, 0, 64, 64);

      ctx.fillStyle = isPentagon ? '#1a4e8f' : '#326e20';
      for (let i = 0; i < 64; i += 8) {
        for (let j = 0; j < 64; j += 8) {
          if ((i + j) % 16 === 0) ctx.fillRect(i, j, 8, 8);
        }
      }

      ctx.fillStyle = 'rgba(255,255,255,0.7)';
      ctx.font = 'bold 16px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(`#${cellId}`, 32, 32);

      const tex = new THREE.CanvasTexture(c);
      tex.magFilter = THREE.NearestFilter;
      tex.minFilter = THREE.NearestFilter;
      return tex;
    }

    // 3. ПОСТРОЕНИЕ СФЕРЫ НА 42 ЯЧЕЙКИ
    const baseIco = new THREE.IcosahedronGeometry(planetRadius, 1);
    const pos = baseIco.attributes.position;
    const vertices = [];
    const vertMap = new Map();
    const precision = 3;

    for (let i = 0; i < pos.count; i++) {
      const v = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i));
      const key = `${v.x.toFixed(precision)}_${v.y.toFixed(precision)}_${v.z.toFixed(precision)}`;
      if (!vertMap.has(key)) {
        vertMap.set(key, vertices.length);
        vertices.push(v);
      }
    }

    const triangles = [];
    for (let i = 0; i < pos.count; i += 3) {
      const k0 = `${pos.getX(i).toFixed(precision)}_${pos.getY(i).toFixed(precision)}_${pos.getZ(i).toFixed(precision)}`;
      const k1 = `${pos.getX(i+1).toFixed(precision)}_${pos.getY(i+1).toFixed(precision)}_${pos.getZ(i+1).toFixed(precision)}`;
      const k2 = `${pos.getX(i+2).toFixed(precision)}_${pos.getY(i+2).toFixed(precision)}_${pos.getZ(i+2).toFixed(precision)}`;
      triangles.push([vertMap.get(k0), vertMap.get(k1), vertMap.get(k2)]);
    }

    const faceCenters = triangles.map(t => {
      return new THREE.Vector3()
        .add(vertices[t[0]]).add(vertices[t[1]]).add(vertices[t[2]])
        .divideScalar(3).normalize().multiplyScalar(planetRadius);
    });

    const vertToFaces = Array.from({ length: vertices.length }, () => []);
    triangles.forEach((t, idx) => {
      vertToFaces[t[0]].push(idx);
      vertToFaces[t[1]].push(idx);
      vertToFaces[t[2]].push(idx);
    });

    const cellsData = {};
    const interactiveMeshes = [];
    const standingLayers = [];

    // Подсветка контура при наведении
    const hoverOutlineGeom = new THREE.BufferGeometry();
    const hoverOutlineMat = new THREE.LineBasicMaterial({
      color: 0x5ce1e6,
      linewidth: 3,
      depthTest: false
    });
    const hoverOutlineMesh = new THREE.LineLoop(hoverOutlineGeom, hoverOutlineMat);
    hoverOutlineMesh.visible = false;
    hoverOutlineMesh.renderOrder = 999;
    planetGroup.add(hoverOutlineMesh);

    function buildHexMesh(cellCenter, sortedFaceIndices) {
      const geom = new THREE.BufferGeometry();
      const positions = [];
      const uvs = [];
      const normal = cellCenter.clone().normalize();

      let up = new THREE.Vector3(0, 1, 0).projectOnPlane(normal).normalize();
      if (up.lengthSq() < 0.001) {
        up = new THREE.Vector3(0, 0, 1).projectOnPlane(normal).normalize();
      }
      const right = new THREE.Vector3().crossVectors(up, normal).normalize();

      let maxRadius = 0.001;
      for (let i = 0; i < sortedFaceIndices.length; i++) {
        const d = faceCenters[sortedFaceIndices[i]].clone().sub(cellCenter).length();
        if (d > maxRadius) maxRadius = d;
      }

      function projectUV(point) {
        const diff = point.clone().sub(cellCenter);
        return {
          u: 0.5 + (diff.dot(right) / (maxRadius * 2.0)),
          v: 0.5 + (diff.dot(up) / (maxRadius * 2.0))
        };
      }

      for (let i = 0; i < sortedFaceIndices.length; i++) {
        const next = (i + 1) % sortedFaceIndices.length;
        const p2 = faceCenters[sortedFaceIndices[i]];
        const p3 = faceCenters[sortedFaceIndices[next]];

        positions.push(cellCenter.x, cellCenter.y, cellCenter.z);
        positions.push(p2.x, p2.y, p2.z);
        positions.push(p3.x, p3.y, p3.z);

        uvs.push(0.5, 0.5);
        const uv2 = projectUV(p2);
        const uv3 = projectUV(p3);
        uvs.push(uv2.u, uv2.v);
        uvs.push(uv3.u, uv3.v);
      }

      geom.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
      geom.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
      geom.computeVertexNormals();
      return geom;
    }

    vertToFaces.forEach((fIndices, cellId) => {
      if (fIndices.length === 0) return;

      const cellCenter = new THREE.Vector3();
      fIndices.forEach(fi => cellCenter.add(faceCenters[fi]));
      cellCenter.divideScalar(fIndices.length).normalize().multiplyScalar(planetRadius);
      const normal = cellCenter.clone().normalize();

      const baseDir = faceCenters[fIndices[0]].clone().sub(cellCenter).normalize();
      const sortedFaces = fIndices.slice().sort((a, b) => {
        const vA = faceCenters[a].clone().sub(cellCenter).normalize();
        const vB = faceCenters[b].clone().sub(cellCenter).normalize();
        return Math.atan2(new THREE.Vector3().crossVectors(baseDir, vA).dot(normal), baseDir.dot(vA)) -
               Math.atan2(new THREE.Vector3().crossVectors(baseDir, vB).dot(normal), baseDir.dot(vB));
      });

      const isPentagon = sortedFaces.length === 5;

      const baseGeom = buildHexMesh(cellCenter, sortedFaces);
      const baseMat = new THREE.MeshLambertMaterial({
        map: createFallbackTexture(cellId, isPentagon),
        transparent: true,
        alphaTest: 0.1,
        side: THREE.FrontSide
      });
      const baseMesh = new THREE.Mesh(baseGeom, baseMat);

      baseMesh.userData = {
        cellId: cellId,
        isPentagon: isPentagon,
        cellCenter: cellCenter,
        normal: normal,
        sortedFaces: sortedFaces,
        layers: [baseMesh]
      };

      planetGroup.add(baseMesh);
      interactiveMeshes.push(baseMesh);

      cellsData[cellId] = {
        artist: "Свободная ячейка",
        desc: isPentagon ? "Особая точка: Пентагон (1 из 12 на планете)." : "Стандартный шестиугольный биом.",
        link: "https://github.com",
        mesh: baseMesh
      };
    });

    // 4. ПОДГРУЗКА И ОРИЕНТАЦИЯ СТОЯЧИХ СЛОЕВ
    const texLoader = new THREE.TextureLoader();

    function applyLayer(cellId, layerIndex, imgUrl) {
      if (!imgUrl || imgUrl.trim() === '') return;

      const cell = cellsData[cellId];
      if (!cell) return;

      texLoader.load(imgUrl, texture => {
        texture.magFilter = THREE.NearestFilter;
        texture.minFilter = THREE.NearestFilter;
        texture.generateMipmaps = false;

        // СЛОЙ 1: Поверхность ячейки (Земля)
        if (layerIndex === 1) {
          cell.mesh.material.map = texture;
          cell.mesh.material.needsUpdate = true;
          return;
        }

        // СЛОИ 2, 3, 4: Стоячие 2.5D Билборды
        const size = 4.4;
        const geom = new THREE.PlaneGeometry(size, size);
        
        // Pivot смещен в основание с микрозаглублением в грунт
        geom.translate(0, size * 0.44, 0);

        // Используем Lambert-материал, чтобы спрайты принимали свет и давали объемную тень
        const mat = new THREE.MeshLambertMaterial({
          map: texture,
          transparent: true,
          alphaTest: 0.15,
          side: THREE.DoubleSide,
          depthWrite: false
        });

        const billboard = new THREE.Mesh(geom, mat);
        billboard.renderOrder = 10 + layerIndex;

        // Смещение по глубине относительно камеры:
        // Слой 2 (кусты/заборчик) выдвинут на +0.55 к камере
        // Слой 3 (яблоня/колодец) в центре (0.0)
        // Слой 4 (дом/ели) отодвинут назад на -0.55 от камеры
        const depthOffsets = {
          2:  0.55,
          3:  0.0,
          4: -0.55
        };

        planetGroup.add(billboard);
        cell.mesh.userData.layers.push(billboard);

        standingLayers.push({
          mesh: billboard,
          cellCenter: cell.mesh.userData.cellCenter,
          normal: cell.mesh.userData.normal,
          depthOffset: depthOffsets[layerIndex] || 0
        });
      });
    }

    // 5. ПАРСИНГ GOOGLE ТАБЛИЦЫ
    async function fetchGoogleSheetData() {
      if (!GOOGLE_SHEET_CSV_URL) return;

      try {
        const resp = await fetch(GOOGLE_SHEET_CSV_URL);
        const csvText = await resp.text();
        const rows = csvText.split('\n').map(r => r.split(','));

        for (let i = 1; i < rows.length; i++) {
          const row = rows[i];
          if (!row || row.length < 4) continue;

          const cellId = parseInt(row[0].trim());
          if (isNaN(cellId) || !cellsData[cellId]) continue;

          cellsData[cellId].artist = row[1]?.trim() || "Анонимный автор";
          cellsData[cellId].desc = row[2]?.trim() || "";
          cellsData[cellId].link = row[3]?.trim() || "#";

          if (row[4]) applyLayer(cellId, 1, row[4].trim());
          if (row[5]) applyLayer(cellId, 2, row[5].trim());
          if (row[6]) applyLayer(cellId, 3, row[6].trim());
          if (row[7]) applyLayer(cellId, 4, row[7].trim());
        }
      } catch (err) {
        console.warn("Не удалось загрузить данные таблицы, используются локальные заглушки.", err);
      }
    }
    fetchGoogleSheetData();

    // 6. RAYCASTING
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hoveredMesh = null;
    let isUserInteracting = false;

    function updateHoverOutline(mesh) {
      if (!mesh) {
        hoverOutlineMesh.visible = false;
        return;
      }

      const { cellCenter, sortedFaces, normal } = mesh.userData;
      const points = [];
      const offset = 0.03;

      for (let i = 0; i < sortedFaces.length; i++) {
        const p = faceCenters[sortedFaces[i]].clone().add(normal.clone().multiplyScalar(offset));
        points.push(p);
      }

      hoverOutlineGeom.setFromPoints(points);
      hoverOutlineMesh.visible = true;
    }

    window.addEventListener('mousemove', e => {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshes);

      if (intersects.length > 0) {
        const target = intersects[0].object;
        if (hoveredMesh !== target) {
          hoveredMesh = target;
          updateHoverOutline(hoveredMesh);
          document.body.style.cursor = 'pointer';
        }
      } else {
        if (hoveredMesh !== null) {
          hoveredMesh = null;
          updateHoverOutline(null);
          document.body.style.cursor = 'default';
        }
      }
    });

    window.addEventListener('mousedown', () => { isUserInteracting = true; });
    window.addEventListener('mouseup', () => { isUserInteracting = false; });
    window.addEventListener('touchstart', () => { isUserInteracting = true; });
    window.addEventListener('touchend', () => { isUserInteracting = false; });

    window.addEventListener('click', e => {
      if (e.target.closest('#info-modal')) return;

      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(interactiveMeshes);

      if (intersects.length > 0) {
        const cellId = intersects[0].object.userData.cellId;
        showModal(cellId);
      }
    });

    // 7. МОДАЛЬНОЕ ОКНО
    const modal = document.getElementById('info-modal');
    const modalArtist = document.getElementById('modal-artist');
    const modalDesc = document.getElementById('modal-desc');
    const modalLink = document.getElementById('modal-link');
    const modalCellType = document.getElementById('modal-cell-type');

    function showModal(cellId) {
      const data = cellsData[cellId];
      const isPentagon = data.mesh.userData.isPentagon;

      modalCellType.innerText = `Ячейка #${cellId} (${isPentagon ? 'Пентагон' : 'Гексагон'})`;
      modalArtist.innerText = data.artist;
      modalDesc.innerText = data.desc || "Описание работы пока не добавлено.";
      modalLink.href = data.link;
      modalLink.style.display = data.link && data.link !== '#' ? 'inline-block' : 'none';

      modal.style.display = 'block';
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    // 8. ДИНАМИЧЕСКИЙ ПАРАЛЛАКС ПО ВЕКТОРУ ВЗГЛЯДА
    function updateStandingLayers() {
      const planetWorldQuat = new THREE.Quaternion();
      planetGroup.getWorldQuaternion(planetWorldQuat);
      const invPlanetQuat = planetWorldQuat.clone().invert();

      standingLayers.forEach(item => {
        const worldNormal = item.normal.clone().applyQuaternion(planetWorldQuat).normalize();
        const worldCenter = item.cellCenter.clone().applyQuaternion(planetWorldQuat);

        // Вектор от ячейки к камере
        const toCam = camera.position.clone().sub(worldCenter).normalize();
        
        // Горизонт взгляда на поверхности ячейки
        const forward = toCam.sub(worldNormal.clone().multiplyScalar(toCam.dot(worldNormal))).normalize();

        if (forward.lengthSq() > 0.001) {
          // 1. Поворот лицом к камере
          const right = new THREE.Vector3().crossVectors(worldNormal, forward).normalize();
          const rotMatrix = new THREE.Matrix4().makeBasis(right, worldNormal, forward);
          const targetQuat = new THREE.Quaternion().setFromRotationMatrix(rotMatrix);
          item.mesh.quaternion.copy(invPlanetQuat.clone().multiply(targetQuat));

          // 2. Смещение по глубине строго вдоль вектора взгляда forward
          const localOffset = forward.clone().applyQuaternion(invPlanetQuat).multiplyScalar(item.depthOffset);
          item.mesh.position.copy(item.cellCenter).add(localOffset);
        }
      });
    }

    // 9. ЦИКЛ РЕНДЕРА
    function animate() {
      requestAnimationFrame(animate);

      // Плавное фоновое вращение планеты в режиме покоя
      if (!isUserInteracting) {
        planetGroup.rotation.y += 0.0012;
      }

      controls.update();
      updateStandingLayers();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener('resize', () => {
      const newAspect = window.innerWidth / window.innerHeight;
      camera.left = -viewSize * newAspect;
      camera.right = viewSize * newAspect;
      camera.top = viewSize;
      camera.bottom = -viewSize;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
